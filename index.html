<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Pixel Brawl",
        "url": "https://playpixelbrawl.netlify.app/",
        "image": "https://playpixelbrawl.netlify.app/assets/og-image.png",
        "description": "A free browser-based 2D fighting game. Pick a fighter, choose an arena, and battle friends locally or the CPU — no install, no accounts, no backend.",
        "genre": "Fighting",
        "gamePlatform": "Web Browser",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "playMode": ["SinglePlayer", "MultiPlayer"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Raj Kamlesh Patel" }
      }
    </script>

    <style>
      :root {
        --bg: #0a0a0f;
        --panel: #14141f;
        --panel-border: #2a2a3d;
        --text: #e8e8f0;
        --dim: #8888a0;
        --p1: #2fd8ff;
        --p1-dark: #0f6a80;
        --p2: #ff3b6b;
        --p2-dark: #801f38;
        --meter: #ffd23f;
        --meter-dark: #8a6c10;
        --accent: #ffd23f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Consolas", "Courier New", monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        user-select: none;
      }
      #app {
        width: 100%;
        max-width: 1000px;
        padding: 16px;
      }
      .screen {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .screen.active {
        display: flex;
      }

      h1 {
        font-size: 2.4em;
        letter-spacing: 6px;
        margin: 4px 0;
        color: var(--accent);
        text-shadow: 0 0 12px rgba(255, 210, 63, 0.5);
      }

      /* ---- select screen ---- */
      .mode-toggle {
        display: flex;
        gap: 10px;
      }
      .mode-btn,
      #btn-start,
      #btn-rematch,
      #btn-change {
        background: var(--panel);
        border: 2px solid var(--panel-border);
        color: var(--text);
        font-family: inherit;
        font-size: 0.95em;
        letter-spacing: 2px;
        padding: 10px 18px;
        cursor: pointer;
        border-radius: 4px;
        transition: all 0.15s;
      }
      .mode-btn:hover,
      #btn-start:hover,
      #btn-rematch:hover,
      #btn-change:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .mode-btn.active {
        border-color: var(--accent);
        color: var(--accent);
        background: #1c1c14;
      }

      .pickers {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .picker {
        background: var(--panel);
        border: 2px solid var(--panel-border);
        border-radius: 6px;
        padding: 12px;
      }
      .picker h2 {
        margin: 0 0 10px;
        font-size: 0.95em;
        letter-spacing: 2px;
        text-align: center;
        color: var(--dim);
      }
      #picker-p1 h2 {
        color: var(--p1);
      }
      #picker-p2 h2 {
        color: var(--p2);
      }
      .vs {
        font-size: 1.6em;
        color: var(--dim);
        letter-spacing: 2px;
      }
      .thumbs {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .thumb {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        border: 2px solid transparent;
        border-radius: 4px;
        padding: 4px;
        background: #0d0d14;
      }
      .thumb canvas {
        image-rendering: pixelated;
        width: 72px;
        height: 84px;
        background: #1a1a24;
      }
      .thumb-label {
        font-size: 0.6em;
        letter-spacing: 1px;
        color: var(--dim);
        text-align: center;
      }
      .thumb-archetype {
        font-size: 0.48em;
        letter-spacing: 0.5px;
        color: #5a5870;
        text-align: center;
        margin-top: -3px;
      }
      .thumb.selected {
        border-color: var(--accent);
        box-shadow: 0 0 8px rgba(255, 210, 63, 0.6);
      }
      .thumb.selected .thumb-label {
        color: var(--accent);
      }
      .thumb.selected .thumb-archetype {
        color: var(--accent);
        opacity: 0.75;
      }

      .arena-picker {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .arena-label {
        font-size: 0.7em;
        letter-spacing: 2px;
        color: var(--dim);
      }
      .arena-thumbs {
        display: flex;
        gap: 8px;
      }
      .thumb.arena-thumb {
        padding: 3px;
        gap: 2px;
      }
      .thumb.arena-thumb canvas {
        width: 96px;
        height: 54px;
        background: #0a0a10;
      }
      .thumb.arena-thumb .thumb-label {
        font-size: 0.55em;
      }

      #btn-start {
        font-size: 1.1em;
        padding: 12px 28px;
      }

      .controls-hint {
        display: flex;
        gap: 40px;
        font-size: 0.72em;
        color: var(--dim);
        letter-spacing: 0.5px;
      }
      .controls-hint b {
        color: var(--text);
      }

      /* ---- fight screen ---- */
      #hud {
        width: 960px;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        background: var(--panel);
        border: 2px solid var(--panel-border);
        border-radius: 6px 6px 0 0;
        padding: 10px 16px;
        gap: 12px;
      }
      .hud-side {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .hud-side.p2 {
        align-items: flex-end;
      }
      .hud-name {
        font-size: 0.85em;
        letter-spacing: 2px;
      }
      #hud-p1 .hud-name {
        color: var(--p1);
      }
      #hud-p2 .hud-name {
        color: var(--p2);
      }
      .bar {
        width: 100%;
        height: 14px;
        background: #000;
        border: 1px solid var(--panel-border);
        border-radius: 2px;
        overflow: hidden;
      }
      .bar.meter {
        height: 6px;
      }
      .bar-fill {
        height: 100%;
        width: 100%;
        transition: width 0.08s linear;
      }
      #health-p1 {
        background: linear-gradient(90deg, var(--p1-dark), var(--p1));
      }
      #health-p2 {
        background: linear-gradient(90deg, var(--p2), var(--p2-dark));
        margin-left: auto;
      }
      #meter-p1 {
        background: linear-gradient(90deg, var(--meter-dark), var(--meter));
      }
      #meter-p2 {
        background: linear-gradient(90deg, var(--meter), var(--meter-dark));
        margin-left: auto;
      }
      .round-pips {
        display: flex;
        gap: 4px;
        margin-top: 2px;
      }
      .pip {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        border: 1px solid var(--dim);
        display: inline-block;
      }
      .pip.filled {
        background: var(--accent);
        border-color: var(--accent);
      }
      .hud-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 70px;
      }
      #timer {
        font-size: 1.8em;
        color: var(--text);
        letter-spacing: 1px;
      }

      .canvas-wrap {
        position: relative;
        width: 960px;
        height: 540px;
        border: 2px solid var(--panel-border);
        border-top: none;
      }
      #game-canvas {
        display: block;
        image-rendering: pixelated;
        width: 960px;
        height: 540px;
        background: #000;
      }
      #banner {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        font-size: 2.2em;
        letter-spacing: 4px;
        color: var(--accent);
        text-shadow:
          0 0 16px rgba(0, 0, 0, 0.9),
          0 0 8px var(--accent);
        opacity: 0;
        transition: opacity 0.15s;
        text-align: center;
      }

      .combo-text {
        position: absolute;
        bottom: 22%;
        font-size: 1.3em;
        font-weight: bold;
        letter-spacing: 1px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .combo-text.show {
        opacity: 1;
      }
      .combo-text.p1 {
        left: 6%;
        color: var(--p1);
        text-shadow:
          0 0 6px rgba(0, 0, 0, 0.9),
          0 0 10px rgba(47, 216, 255, 0.75);
      }
      .combo-text.p2 {
        right: 6%;
        text-align: right;
        color: var(--p2);
        text-shadow:
          0 0 6px rgba(0, 0, 0, 0.9),
          0 0 10px rgba(255, 59, 107, 0.75);
      }
      .combo-text.pop {
        animation: comboPop 0.28s ease-out;
      }
      @keyframes comboPop {
        0% {
          transform: scale(1.6);
        }
        60% {
          transform: scale(0.95);
        }
        100% {
          transform: scale(1);
        }
      }
      #banner.show {
        opacity: 1;
      }

      /* ---- postmatch screen ---- */
      #postmatch-title {
        font-size: 2em;
        letter-spacing: 3px;
        color: var(--accent);
      }
      .postmatch-buttons {
        display: flex;
        gap: 16px;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div
        style="
          max-width: 480px;
          margin: 80px auto;
          padding: 24px;
          text-align: center;
          font-family: sans-serif;
          color: #e8e8f0;
          background: #14141f;
          border: 2px solid #2a2a3d;
          border-radius: 6px;
        "
      >
        <h1 style="color: #ffd23f">Pixel Brawl</h1>
        <p>
          Pixel Brawl is a browser fighting game that needs JavaScript to run.
          Please enable JavaScript in your browser to play.
        </p>
      </div>
    </noscript>
    <div id="app">
      <div id="screen-select" class="screen active">
        <h1>PIXEL BRAWL</h1>
        <div class="mode-toggle">
          <button class="mode-btn active" data-mode="1P">
            1 PLAYER (VS CPU)
          </button>
          <button class="mode-btn" data-mode="2P">2 PLAYER</button>
        </div>
        <div class="pickers">
          <div class="picker" id="picker-p1">
            <h2>PLAYER 1</h2>
            <div class="thumbs" data-side="0"></div>
          </div>
          <div class="vs">VS</div>
          <div class="picker" id="picker-p2">
            <h2 id="p2-label">CPU FIGHTER</h2>
            <div class="thumbs" data-side="1"></div>
          </div>
        </div>
        <div class="arena-picker">
          <div class="arena-label">ARENA</div>
          <div class="arena-thumbs" id="arena-thumbs"></div>
        </div>
        <button id="btn-start">START FIGHT</button>
        <div class="controls-hint">
          <div>
            <b>P1</b> — WASD move/jump/crouch, Shift dash, J punch, K kick, L
            special
          </div>
          <div>
            <b>P2</b> — Arrows move/jump/crouch, / dash, 1 punch, 2 kick, 3
            special
          </div>
        </div>
        <div class="controls-hint">
          <div>Esc returns to this screen at any time</div>
        </div>
      </div>

      <div id="screen-fight" class="screen">
        <div id="hud">
          <div class="hud-side p1" id="hud-p1">
            <div class="hud-name" id="name-p1">PLAYER 1</div>
            <div class="bar health">
              <div class="bar-fill" id="health-p1"></div>
            </div>
            <div class="bar meter">
              <div class="bar-fill" id="meter-p1"></div>
            </div>
            <div class="round-pips" id="pips-p1"></div>
          </div>
          <div class="hud-center">
            <div id="timer">60</div>
          </div>
          <div class="hud-side p2" id="hud-p2">
            <div class="hud-name" id="name-p2">PLAYER 2</div>
            <div class="bar health">
              <div class="bar-fill" id="health-p2"></div>
            </div>
            <div class="bar meter">
              <div class="bar-fill" id="meter-p2"></div>
            </div>
            <div class="round-pips" id="pips-p2"></div>
          </div>
        </div>
        <div class="canvas-wrap">
          <canvas id="game-canvas" width="960" height="540"></canvas>
          <div id="banner"></div>
          <div class="combo-text p1" id="combo-p1"></div>
          <div class="combo-text p2" id="combo-p2"></div>
        </div>
      </div>

      <div id="screen-postmatch" class="screen">
        <h1 id="postmatch-title">WINNER</h1>
        <div class="postmatch-buttons">
          <button id="btn-rematch">REMATCH</button>
          <button id="btn-change">CHANGE CHARACTERS</button>
        </div>
      </div>
    </div>
    <script src="game.js"></script>
  </body>
</html>
